<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWH Intelligence Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    }
    .prose p { margin-bottom: 0.75rem; }
    .animate-pulse-subtle { animation: pulse-subtle 2s infinite; }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const API_BASE = '';

    // ============================================================
    // APP
    // ============================================================
    function App() {
      const [page, setPage] = useState('dashboard');

      const pages = [
        { id: 'dashboard', label: 'Dashboard', icon: '' },
        { id: 'articles', label: 'Articles', icon: '' },
        { id: 'viewpoints', label: 'Viewpoints', icon: '' },
        { id: 'personas', label: 'Personas', icon: '' },
        { id: 'submit', label: 'Submit', icon: '' },
        { id: 'sources', label: 'Sources', icon: '' },
        { id: 'entities', label: 'Entities', icon: '' },
      ];

      return (
        <div className="min-h-screen">
          <nav className="gradient-bg text-white shadow-lg">
            <div className="max-w-7xl mx-auto px-4 py-4">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-2">
                  <span className="text-2xl">&#x1F3E5;</span>
                  <h1 className="text-xl font-bold">TWH Intelligence Platform</h1>
                </div>
                <div className="flex space-x-1 overflow-x-auto">
                  {pages.map(p => (
                    <button
                      key={p.id}
                      onClick={() => setPage(p.id)}
                      className={`px-3 py-2 rounded-lg transition text-sm whitespace-nowrap ${
                        page === p.id ? 'bg-white/20 font-medium' : 'hover:bg-white/10'
                      }`}
                    >
                      {p.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </nav>

          <main className="max-w-7xl mx-auto px-4 py-8">
            {page === 'dashboard' && <Dashboard onNavigate={setPage} />}
            {page === 'articles' && <Articles onNavigate={setPage} />}
            {page === 'viewpoints' && <Viewpoints />}
            {page === 'personas' && <Personas />}
            {page === 'submit' && <SubmitArticle />}
            {page === 'sources' && <Sources />}
            {page === 'entities' && <Entities />}
          </main>
        </div>
      );
    }

    // ============================================================
    // DASHBOARD
    // ============================================================
    function Dashboard({ onNavigate }) {
      const [data, setData] = useState(null);
      const [triggering, setTriggering] = useState(null);

      useEffect(() => {
        fetch(`${API_BASE}/api/dashboard`)
          .then(r => r.json())
          .then(setData)
          .catch(console.error);
      }, []);

      const triggerWorkflow = async (type) => {
        setTriggering(type);
        try {
          const endpoint = type === 'viewpoint' ? '/api/viewpoints/generate' : '/api/trigger';
          await fetch(`${API_BASE}${endpoint}`, { method: 'POST' });
          alert(`${type === 'viewpoint' ? 'Viewpoint' : 'Intelligence'} workflow triggered!`);
        } catch (e) {
          alert('Failed to trigger workflow');
        }
        setTriggering(null);
      };

      if (!data) return <LoadingSpinner />;

      const s = data.stats || {};
      const stats = [
        { label: 'Articles', value: s.total_articles || 0, color: 'bg-blue-500' },
        { label: 'Summaries', value: s.total_summaries || 0, color: 'bg-indigo-500' },
        { label: 'Viewpoints', value: s.total_viewpoints || 0, color: 'bg-purple-500' },
        { label: 'Personas', value: s.total_personas || 0, color: 'bg-pink-500' },
        { label: 'Organizations', value: s.total_organizations || 0, color: 'bg-green-500' },
        { label: 'Active Sources', value: s.active_sources || 0, color: 'bg-cyan-500' },
      ];

      return (
        <div>
          <div className="flex justify-between items-center mb-8">
            <h2 className="text-2xl font-bold text-gray-800">Dashboard</h2>
            <div className="flex space-x-3">
              <button
                onClick={() => triggerWorkflow('intelligence')}
                disabled={triggering}
                className="bg-gradient-to-r from-blue-500 to-indigo-600 text-white px-5 py-2 rounded-lg hover:opacity-90 disabled:opacity-50 text-sm"
              >
                {triggering === 'intelligence' ? 'Running...' : 'Run Scraper'}
              </button>
              <button
                onClick={() => triggerWorkflow('viewpoint')}
                disabled={triggering}
                className="bg-gradient-to-r from-purple-500 to-pink-600 text-white px-5 py-2 rounded-lg hover:opacity-90 disabled:opacity-50 text-sm"
              >
                {triggering === 'viewpoint' ? 'Running...' : 'Generate Viewpoints'}
              </button>
            </div>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
            {stats.map(stat => (
              <div key={stat.label} className="bg-white rounded-xl shadow-sm p-4 card-hover transition">
                <div className={`w-8 h-8 rounded-lg ${stat.color} flex items-center justify-center text-white text-sm font-bold mb-2`}>
                  {stat.value}
                </div>
                <div className="text-2xl font-bold text-gray-800">{stat.value}</div>
                <div className="text-sm text-gray-500">{stat.label}</div>
              </div>
            ))}
          </div>

          {/* Quick actions */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <button
              onClick={() => onNavigate('submit')}
              className="bg-white rounded-xl shadow-sm p-6 card-hover transition text-left"
            >
              <div className="text-lg font-semibold text-gray-800 mb-1">Submit Article</div>
              <p className="text-sm text-gray-500">Manually add a URL or paste content for analysis</p>
            </button>
            <button
              onClick={() => onNavigate('viewpoints')}
              className="bg-white rounded-xl shadow-sm p-6 card-hover transition text-left"
            >
              <div className="text-lg font-semibold text-gray-800 mb-1">View Briefs</div>
              <p className="text-sm text-gray-500">Read analyst views and persona-specific intelligence briefs</p>
            </button>
            <button
              onClick={() => onNavigate('personas')}
              className="bg-white rounded-xl shadow-sm p-6 card-hover transition text-left"
            >
              <div className="text-lg font-semibold text-gray-800 mb-1">Manage Personas</div>
              <p className="text-sm text-gray-500">View analysts, output personas, and transcript data</p>
            </button>
          </div>

          <h3 className="text-xl font-semibold mb-4 text-gray-800">Recent Articles</h3>
          <div className="space-y-4">
            {(data.recentArticles || []).map(article => (
              <ArticleCard key={article.id} article={article} />
            ))}
            {(!data.recentArticles || data.recentArticles.length === 0) && (
              <EmptyState message="No articles yet. Run the scraper or submit an article to get started." />
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // ARTICLES (with viewpoint preview)
    // ============================================================
    function Articles({ onNavigate }) {
      const [articles, setArticles] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedArticle, setSelectedArticle] = useState(null);

      useEffect(() => {
        fetch(`${API_BASE}/api/articles`)
          .then(r => r.json())
          .then(data => {
            setArticles(data.articles || []);
            setLoading(false);
          })
          .catch(console.error);
      }, []);

      if (loading) return <LoadingSpinner />;

      return (
        <div>
          <h2 className="text-2xl font-bold text-gray-800 mb-6">All Articles</h2>

          {selectedArticle && (
            <ArticleDetail
              articleId={selectedArticle}
              onClose={() => setSelectedArticle(null)}
            />
          )}

          <div className="space-y-4">
            {articles.map(article => (
              <div key={article.id} className="bg-white rounded-xl shadow-sm p-6 card-hover transition">
                <div className="flex justify-between items-start">
                  <div className="flex-1">
                    <a
                      href={article.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-lg font-semibold text-gray-800 hover:text-purple-600 transition"
                    >
                      {article.title}
                    </a>
                    <div className="flex items-center space-x-3 mt-2 text-sm text-gray-500">
                      {article.source_name && <span>{article.source_name}</span>}
                      {article.published_date && (
                        <span>{new Date(article.published_date).toLocaleDateString()}</span>
                      )}
                    </div>
                  </div>
                  <div className="flex items-center space-x-3">
                    {article.relevance_score && (
                      <div className={`px-3 py-1 rounded-full text-sm font-medium ${
                        article.relevance_score >= 8 ? 'bg-green-100 text-green-800' :
                        article.relevance_score >= 5 ? 'bg-yellow-100 text-yellow-800' :
                        'bg-gray-100 text-gray-800'
                      }`}>
                        {article.relevance_score}/10
                      </div>
                    )}
                    <button
                      onClick={() => setSelectedArticle(article.id)}
                      className="bg-purple-100 text-purple-700 px-3 py-1 rounded-lg text-sm hover:bg-purple-200 transition"
                    >
                      View Briefs
                    </button>
                  </div>
                </div>

                {article.short_summary && (
                  <p className="text-gray-600 text-sm mt-3">{article.short_summary}</p>
                )}

                <div className="flex flex-wrap gap-2 mt-3">
                  {(article.topic_tags || []).map(tag => (
                    <span key={tag} className="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs">
                      {tag}
                    </span>
                  ))}
                </div>

                <div className="mt-4 pt-4 border-t border-gray-100 grid grid-cols-3 gap-4 text-sm">
                  <div>
                    <span className="text-gray-500">Organizations:</span>
                    <div className="flex flex-wrap gap-1 mt-1">
                      {(article.organizations || []).filter(Boolean).map(org => (
                        <span key={org} className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs">
                          {org}
                        </span>
                      ))}
                    </div>
                  </div>
                  <div>
                    <span className="text-gray-500">Technologies:</span>
                    <div className="flex flex-wrap gap-1 mt-1">
                      {(article.technologies || []).filter(Boolean).map(tech => (
                        <span key={tech} className="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs">
                          {tech}
                        </span>
                      ))}
                    </div>
                  </div>
                  <div>
                    <span className="text-gray-500">People:</span>
                    <div className="flex flex-wrap gap-1 mt-1">
                      {(article.people || []).filter(Boolean).map(person => (
                        <span key={person} className="bg-orange-100 text-orange-700 px-2 py-0.5 rounded text-xs">
                          {person}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ============================================================
    // ARTICLE DETAIL (modal with viewpoints)
    // ============================================================
    function ArticleDetail({ articleId, onClose }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch(`${API_BASE}/api/articles/${articleId}`)
          .then(r => r.json())
          .then(d => { setData(d); setLoading(false); })
          .catch(console.error);
      }, [articleId]);

      if (loading) return null;
      if (!data || !data.article) return null;

      const article = data.article;
      const viewpoints = data.viewpoints || [];
      const analystViews = viewpoints.filter(v => !v.persona_slug?.startsWith('output-'));
      const briefViews = viewpoints.filter(v => v.persona_slug?.startsWith('output-'));

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-start justify-center overflow-y-auto py-8">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl mx-4">
            <div className="p-6 border-b border-gray-100 flex justify-between items-start">
              <div>
                <h3 className="text-xl font-bold text-gray-800">{article.title}</h3>
                <p className="text-sm text-gray-500 mt-1">
                  {article.source_name} &middot; {article.published_date ? new Date(article.published_date).toLocaleDateString() : 'N/A'}
                </p>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
            </div>

            <div className="p-6">
              {article.short_summary && (
                <div className="mb-6">
                  <h4 className="text-sm font-semibold text-gray-500 uppercase mb-2">Summary</h4>
                  <p className="text-gray-700">{article.short_summary}</p>
                </div>
              )}

              {analystViews.length > 0 && (
                <div className="mb-6">
                  <h4 className="text-sm font-semibold text-gray-500 uppercase mb-3">Analyst View</h4>
                  {analystViews.map(vp => (
                    <ViewpointCard key={vp.id} viewpoint={vp} isAnalyst={true} />
                  ))}
                </div>
              )}

              {briefViews.length > 0 && (
                <div className="mb-6">
                  <h4 className="text-sm font-semibold text-gray-500 uppercase mb-3">Intelligence Briefs</h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {briefViews.map(vp => (
                      <ViewpointCard key={vp.id} viewpoint={vp} isAnalyst={false} />
                    ))}
                  </div>
                </div>
              )}

              {viewpoints.length === 0 && (
                <EmptyState message="No viewpoints generated yet for this article." />
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // VIEWPOINTS PAGE
    // ============================================================
    function Viewpoints() {
      const [articles, setArticles] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedArticle, setSelectedArticle] = useState(null);
      const [filter, setFilter] = useState('all');

      useEffect(() => {
        fetch(`${API_BASE}/api/articles`)
          .then(r => r.json())
          .then(data => {
            setArticles(data.articles || []);
            setLoading(false);
          })
          .catch(console.error);
      }, []);

      if (loading) return <LoadingSpinner />;

      return (
        <div>
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-bold text-gray-800">Viewpoints & Briefs</h2>
            <div className="flex space-x-2">
              {['all', 'has-briefs'].map(f => (
                <button
                  key={f}
                  onClick={() => setFilter(f)}
                  className={`px-3 py-1.5 rounded-lg text-sm transition ${
                    filter === f ? 'bg-purple-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'
                  }`}
                >
                  {f === 'all' ? 'All Articles' : 'With Briefs'}
                </button>
              ))}
            </div>
          </div>

          {selectedArticle && (
            <ArticleDetail
              articleId={selectedArticle}
              onClose={() => setSelectedArticle(null)}
            />
          )}

          <div className="space-y-4">
            {articles.map(article => (
              <div
                key={article.id}
                onClick={() => setSelectedArticle(article.id)}
                className="bg-white rounded-xl shadow-sm p-5 card-hover transition cursor-pointer"
              >
                <div className="flex justify-between items-start">
                  <div className="flex-1">
                    <h3 className="font-semibold text-gray-800">{article.title}</h3>
                    <div className="flex items-center space-x-3 mt-1 text-sm text-gray-500">
                      {article.source_name && <span>{article.source_name}</span>}
                      {article.published_date && (
                        <span>{new Date(article.published_date).toLocaleDateString()}</span>
                      )}
                    </div>
                    {article.short_summary && (
                      <p className="text-gray-600 text-sm mt-2 line-clamp-2">{article.short_summary}</p>
                    )}
                  </div>
                  <div className="flex flex-col items-end space-y-2 ml-4">
                    {article.relevance_score && (
                      <div className={`px-2 py-0.5 rounded-full text-xs font-medium ${
                        article.relevance_score >= 8 ? 'bg-green-100 text-green-800' :
                        article.relevance_score >= 5 ? 'bg-yellow-100 text-yellow-800' :
                        'bg-gray-100 text-gray-800'
                      }`}>
                        {article.relevance_score}/10
                      </div>
                    )}
                    <span className="text-purple-600 text-sm font-medium">View Briefs &rarr;</span>
                  </div>
                </div>
                <div className="flex flex-wrap gap-1 mt-3">
                  {(article.topic_tags || []).map(tag => (
                    <span key={tag} className="bg-purple-50 text-purple-600 px-2 py-0.5 rounded text-xs">
                      {tag}
                    </span>
                  ))}
                </div>
              </div>
            ))}
            {articles.length === 0 && (
              <EmptyState message="No articles yet. Run the scraper or submit an article to get started." />
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // VIEWPOINT CARD
    // ============================================================
    function ViewpointCard({ viewpoint, isAnalyst }) {
      const [expanded, setExpanded] = useState(isAnalyst);
      const vp = viewpoint;
      const meta = vp.generation_metadata || {};

      const personaColor = isAnalyst ? 'indigo' : getOutputColor(vp.persona_slug);
      const bgColor = `bg-${personaColor}-50`;
      const borderColor = `border-${personaColor}-200`;
      const textColor = `text-${personaColor}-800`;

      return (
        <div className={`rounded-xl border p-4 ${expanded ? '' : 'cursor-pointer'}`} onClick={() => !expanded && setExpanded(true)}>
          <div className="flex justify-between items-start mb-2">
            <div>
              <span className="font-semibold text-gray-800">{vp.persona_name || vp.persona_slug}</span>
              {vp.persona_title && (
                <span className="text-sm text-gray-500 ml-2">{vp.persona_title}</span>
              )}
            </div>
            <div className="flex items-center space-x-2">
              {meta.relevanceRating && (
                <span className={`px-2 py-0.5 rounded text-xs font-medium ${
                  meta.relevanceRating === 'critical' ? 'bg-red-100 text-red-700' :
                  meta.relevanceRating === 'high' ? 'bg-orange-100 text-orange-700' :
                  meta.relevanceRating === 'medium' ? 'bg-yellow-100 text-yellow-700' :
                  'bg-gray-100 text-gray-600'
                }`}>
                  {meta.relevanceRating}
                </span>
              )}
              {vp.confidence_score && (
                <span className="text-xs text-gray-400">{Math.round(vp.confidence_score * 100)}%</span>
              )}
              <button
                onClick={(e) => { e.stopPropagation(); setExpanded(!expanded); }}
                className="text-gray-400 hover:text-gray-600 text-sm"
              >
                {expanded ? 'Collapse' : 'Expand'}
              </button>
            </div>
          </div>

          {meta.headline && (
            <p className="font-medium text-gray-700 text-sm mb-2">{meta.headline}</p>
          )}

          {expanded && (
            <div>
              <div className="text-sm text-gray-700 whitespace-pre-line prose mt-2">
                {vp.viewpoint_text}
              </div>

              {vp.key_insights && vp.key_insights.length > 0 && (
                <div className="mt-3 pt-3 border-t border-gray-100">
                  <p className="text-xs font-semibold text-gray-500 uppercase mb-1">Key Insights</p>
                  <ul className="space-y-1">
                    {vp.key_insights.map((insight, i) => (
                      <li key={i} className="text-sm text-gray-600 flex items-start">
                        <span className="text-purple-500 mr-2 mt-0.5">{insight.startsWith('ACTION:') ? '>' : '-'}</span>
                        <span>{insight.replace('ACTION: ', '')}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}
            </div>
          )}

          {!expanded && vp.viewpoint_text && (
            <p className="text-sm text-gray-500 mt-1 line-clamp-2">{vp.viewpoint_text}</p>
          )}
        </div>
      );
    }

    function getOutputColor(slug) {
      if (!slug) return 'gray';
      if (slug.includes('cio') && !slug.includes('ciso')) return 'blue';
      if (slug.includes('ciso')) return 'red';
      if (slug.includes('sales')) return 'green';
      return 'amber';
    }

    // ============================================================
    // PERSONAS PAGE
    // ============================================================
    function Personas() {
      const [personas, setPersonas] = useState([]);
      const [loading, setLoading] = useState(true);
      const [tab, setTab] = useState('analysts');
      const [ingesting, setIngesting] = useState(null);

      useEffect(() => {
        fetch(`${API_BASE}/api/personas`)
          .then(r => r.json())
          .then(data => {
            setPersonas(data.personas || []);
            setLoading(false);
          })
          .catch(console.error);
      }, []);

      const triggerIngest = async (slug, playlistId) => {
        if (!playlistId) {
          alert('No YouTube playlist configured for this persona.');
          return;
        }
        setIngesting(slug);
        try {
          await fetch(`${API_BASE}/api/transcripts/ingest`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ personaSlug: slug, playlistId, maxVideos: 10 }),
          });
          alert(`Transcript ingestion triggered for ${slug}!`);
        } catch (e) {
          alert('Failed to trigger ingestion');
        }
        setIngesting(null);
      };

      if (loading) return <LoadingSpinner />;

      const analysts = personas.filter(p => !p.slug.startsWith('output-'));
      const outputPersonas = personas.filter(p => p.slug.startsWith('output-'));

      const displayed = tab === 'analysts' ? analysts : outputPersonas;

      return (
        <div>
          <h2 className="text-2xl font-bold text-gray-800 mb-6">Personas</h2>

          <div className="flex space-x-2 mb-6">
            <button
              onClick={() => setTab('analysts')}
              className={`px-4 py-2 rounded-lg transition ${
                tab === 'analysts' ? 'bg-purple-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'
              }`}
            >
              Analysts ({analysts.length})
            </button>
            <button
              onClick={() => setTab('output')}
              className={`px-4 py-2 rounded-lg transition ${
                tab === 'output' ? 'bg-purple-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'
              }`}
            >
              Output Personas ({outputPersonas.length})
            </button>
          </div>

          {tab === 'analysts' && (
            <div className="bg-purple-50 rounded-xl p-4 mb-6 text-sm text-purple-800">
              <strong>How it works:</strong> Each article is routed to the ONE best-suited analyst based on topic tags.
              Bill Russell handles strategy/AI/EHR topics. Drex DeFord handles cybersecurity/compliance.
              Sarah Richardson handles leadership/workforce topics. Their analysis is then repackaged into output persona briefs.
            </div>
          )}

          {tab === 'output' && (
            <div className="bg-blue-50 rounded-xl p-4 mb-6 text-sm text-blue-800">
              <strong>Output Personas</strong> receive the analyst's view and repackage it for their specific audience:
              CIO (strategic), CISO (security), Vendor Sales Rep (buyer intelligence), General Healthcare IT (industry trends).
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {displayed.map(persona => (
              <div key={persona.id} className="bg-white rounded-xl shadow-sm p-6 card-hover transition">
                <div className="flex justify-between items-start mb-3">
                  <div>
                    <h3 className="text-lg font-bold text-gray-800">{persona.name}</h3>
                    {persona.title && <p className="text-sm text-gray-500">{persona.title}</p>}
                  </div>
                  <span className={`px-2 py-1 rounded text-xs ${
                    persona.enabled ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'
                  }`}>
                    {persona.enabled ? 'Active' : 'Disabled'}
                  </span>
                </div>

                {persona.background && (
                  <p className="text-sm text-gray-600 mb-3">{persona.background}</p>
                )}

                {persona.framework && persona.framework !== 'Output persona' && (
                  <div className="bg-gray-50 rounded-lg p-3 mb-3">
                    <p className="text-xs font-semibold text-gray-500 uppercase mb-1">Framework</p>
                    <p className="text-sm text-gray-700 italic">"{persona.framework}"</p>
                  </div>
                )}

                {persona.show_names && persona.show_names.length > 0 && (
                  <div className="flex flex-wrap gap-2 mb-3">
                    {persona.show_names.map(show => (
                      <span key={show} className="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs">
                        {show}
                      </span>
                    ))}
                  </div>
                )}

                <div className="flex items-center space-x-4 text-sm text-gray-500 pt-3 border-t border-gray-100">
                  <span>{persona.viewpoint_count || 0} viewpoints</span>
                  {persona.transcript_count !== undefined && (
                    <span>{persona.transcript_count} transcripts</span>
                  )}
                </div>

                {tab === 'analysts' && persona.youtube_playlist_id && (
                  <button
                    onClick={() => triggerIngest(persona.slug, persona.youtube_playlist_id)}
                    disabled={ingesting === persona.slug}
                    className="mt-3 w-full bg-indigo-100 text-indigo-700 px-4 py-2 rounded-lg text-sm hover:bg-indigo-200 transition disabled:opacity-50"
                  >
                    {ingesting === persona.slug ? 'Ingesting...' : 'Ingest YouTube Transcripts'}
                  </button>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ============================================================
    // SUBMIT ARTICLE
    // ============================================================
    function SubmitArticle() {
      const [mode, setMode] = useState('url');
      const [url, setUrl] = useState('');
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [result, setResult] = useState(null);

      const handleSubmit = async () => {
        if (mode === 'url' && !url) return alert('Please enter a URL');
        if (mode === 'content' && (!title || !content)) return alert('Please enter a title and content');

        setSubmitting(true);
        setResult(null);
        try {
          const body = mode === 'url'
            ? { url }
            : { title, content };

          const res = await fetch(`${API_BASE}/api/articles/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          setResult(data);
        } catch (e) {
          setResult({ error: 'Failed to submit article' });
        }
        setSubmitting(false);
      };

      return (
        <div>
          <h2 className="text-2xl font-bold text-gray-800 mb-6">Submit Article</h2>

          <div className="bg-white rounded-xl shadow-sm p-6 max-w-2xl">
            <div className="flex space-x-2 mb-6">
              <button
                onClick={() => setMode('url')}
                className={`px-4 py-2 rounded-lg transition ${
                  mode === 'url' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                }`}
              >
                From URL
              </button>
              <button
                onClick={() => setMode('content')}
                className={`px-4 py-2 rounded-lg transition ${
                  mode === 'content' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                }`}
              >
                Paste Content
              </button>
            </div>

            {mode === 'url' ? (
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-2">Article URL</label>
                <input
                  type="url"
                  value={url}
                  onChange={e => setUrl(e.target.value)}
                  placeholder="https://www.healthcareitnews.com/news/..."
                  className="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                />
                <p className="text-sm text-gray-500 mt-2">
                  The platform will scrape the page, extract entities, generate a summary, route to the best analyst, and create persona briefs.
                </p>
              </div>
            ) : (
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Title</label>
                  <input
                    type="text"
                    value={title}
                    onChange={e => setTitle(e.target.value)}
                    placeholder="Article headline..."
                    className="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Content</label>
                  <textarea
                    value={content}
                    onChange={e => setContent(e.target.value)}
                    placeholder="Paste the full article text here..."
                    rows={10}
                    className="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none resize-y"
                  />
                </div>
              </div>
            )}

            <button
              onClick={handleSubmit}
              disabled={submitting}
              className="mt-6 w-full bg-gradient-to-r from-purple-500 to-indigo-600 text-white py-3 rounded-lg hover:opacity-90 disabled:opacity-50 font-medium"
            >
              {submitting ? 'Processing... (this may take a minute)' : 'Submit & Analyze'}
            </button>
          </div>

          {result && (
            <div className={`mt-6 max-w-2xl rounded-xl p-6 ${result.error ? 'bg-red-50' : 'bg-green-50'}`}>
              {result.error ? (
                <div className="text-red-700">
                  <p className="font-semibold">Error</p>
                  <p className="text-sm">{result.error}</p>
                </div>
              ) : (
                <div className="text-green-800">
                  <p className="font-semibold mb-2">Article submitted successfully!</p>
                  {result.article && (
                    <div className="text-sm space-y-1">
                      <p><strong>Title:</strong> {result.article.title}</p>
                      {result.summary && <p><strong>Summary:</strong> {result.summary.short_summary}</p>}
                      {result.summary && <p><strong>Relevance:</strong> {result.summary.relevance_score}/10</p>}
                      {result.entities && (
                        <p><strong>Entities:</strong> {result.entities.organizations?.length || 0} orgs, {result.entities.technologies?.length || 0} techs, {result.entities.people?.length || 0} people</p>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // SOURCES
    // ============================================================
    function Sources() {
      const [sources, setSources] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showForm, setShowForm] = useState(false);
      const [newSource, setNewSource] = useState({ name: '', url: '', sourceType: 'rss', priority: 5 });

      const fetchSources = () => {
        fetch(`${API_BASE}/api/sources`)
          .then(r => r.json())
          .then(data => {
            setSources(data.sources || []);
            setLoading(false);
          })
          .catch(console.error);
      };

      useEffect(() => { fetchSources(); }, []);

      const addSource = async () => {
        await fetch(`${API_BASE}/api/sources`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newSource)
        });
        setShowForm(false);
        setNewSource({ name: '', url: '', sourceType: 'rss', priority: 5 });
        fetchSources();
      };

      const toggleSource = async (source) => {
        await fetch(`${API_BASE}/api/sources/${source.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled: !source.enabled })
        });
        fetchSources();
      };

      const deleteSource = async (id) => {
        if (confirm('Are you sure you want to delete this source?')) {
          await fetch(`${API_BASE}/api/sources/${id}`, { method: 'DELETE' });
          fetchSources();
        }
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div>
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-bold text-gray-800">News Sources</h2>
            <button
              onClick={() => setShowForm(!showForm)}
              className="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700"
            >
              + Add Source
            </button>
          </div>

          {showForm && (
            <div className="bg-white rounded-xl shadow-sm p-6 mb-6">
              <h3 className="font-semibold mb-4">Add New Source</h3>
              <div className="grid grid-cols-2 gap-4">
                <input
                  type="text"
                  placeholder="Source Name"
                  value={newSource.name}
                  onChange={e => setNewSource({...newSource, name: e.target.value})}
                  className="border rounded-lg px-4 py-2"
                />
                <input
                  type="url"
                  placeholder="URL (RSS feed or website)"
                  value={newSource.url}
                  onChange={e => setNewSource({...newSource, url: e.target.value})}
                  className="border rounded-lg px-4 py-2"
                />
                <select
                  value={newSource.sourceType}
                  onChange={e => setNewSource({...newSource, sourceType: e.target.value})}
                  className="border rounded-lg px-4 py-2"
                >
                  <option value="rss">RSS Feed</option>
                  <option value="html">Website</option>
                </select>
                <input
                  type="number"
                  placeholder="Priority (1-10)"
                  value={newSource.priority}
                  onChange={e => setNewSource({...newSource, priority: parseInt(e.target.value)})}
                  className="border rounded-lg px-4 py-2"
                  min="1"
                  max="10"
                />
              </div>
              <div className="flex justify-end mt-4 space-x-2">
                <button onClick={() => setShowForm(false)} className="px-4 py-2 text-gray-600 hover:text-gray-800">Cancel</button>
                <button onClick={addSource} className="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Add Source</button>
              </div>
            </div>
          )}

          <div className="space-y-4">
            {sources.map(source => (
              <div key={source.id} className="bg-white rounded-xl shadow-sm p-6 card-hover transition">
                <div className="flex justify-between items-center">
                  <div className="flex-1">
                    <div className="flex items-center space-x-3">
                      <span className={`w-3 h-3 rounded-full ${source.enabled ? 'bg-green-500' : 'bg-gray-300'}`}></span>
                      <h3 className="font-semibold text-gray-800">{source.name}</h3>
                      <span className="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-xs uppercase">
                        {source.source_type || source.type}
                      </span>
                    </div>
                    <a href={source.url} target="_blank" className="text-sm text-gray-500 hover:text-purple-600 mt-1 block truncate max-w-xl">
                      {source.url}
                    </a>
                  </div>
                  <div className="flex items-center space-x-4">
                    <span className="text-sm text-gray-500">{source.article_count || 0} articles</span>
                    <button
                      onClick={() => toggleSource(source)}
                      className={`px-3 py-1 rounded text-sm ${source.enabled ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}
                    >
                      {source.enabled ? 'Enabled' : 'Disabled'}
                    </button>
                    <button
                      onClick={() => deleteSource(source.id)}
                      className="text-red-500 hover:text-red-700"
                    >
                      Delete
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ============================================================
    // ENTITIES
    // ============================================================
    function Entities() {
      const [tab, setTab] = useState('organizations');
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        setLoading(true);
        fetch(`${API_BASE}/api/entities/${tab}`)
          .then(r => r.json())
          .then(d => {
            setData(d[tab] || []);
            setLoading(false);
          })
          .catch(console.error);
      }, [tab]);

      return (
        <div>
          <h2 className="text-2xl font-bold text-gray-800 mb-6">Entity Browser</h2>

          <div className="flex space-x-2 mb-6">
            {['organizations', 'technologies', 'people'].map(t => (
              <button
                key={t}
                onClick={() => setTab(t)}
                className={`px-4 py-2 rounded-lg transition ${
                  tab === t ? 'bg-purple-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'
                }`}
              >
                {t.charAt(0).toUpperCase() + t.slice(1)}
              </button>
            ))}
          </div>

          {loading ? (
            <LoadingSpinner />
          ) : (
            <div className="bg-white rounded-xl shadow-sm overflow-hidden">
              <table className="w-full">
                <thead className="bg-gray-50">
                  <tr>
                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                    {tab === 'organizations' && <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>}
                    {tab === 'technologies' && <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Category</th>}
                    {tab === 'people' && <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Title</th>}
                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Articles</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {data.map((item, i) => (
                    <tr key={i} className="hover:bg-gray-50">
                      <td className="px-6 py-4 font-medium text-gray-800">
                        {item.canonical_name || item.name}
                      </td>
                      <td className="px-6 py-4 text-gray-600">
                        {tab === 'organizations' && (
                          <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs">
                            {item.type || 'N/A'}
                          </span>
                        )}
                        {tab === 'technologies' && (
                          <span className="bg-green-100 text-green-700 px-2 py-1 rounded text-xs">
                            {item.category || 'N/A'}
                          </span>
                        )}
                        {tab === 'people' && (item.title || item.organization_name || 'N/A')}
                      </td>
                      <td className="px-6 py-4 text-gray-600">{item.article_count}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {data.length === 0 && <EmptyState message="No entities found." />}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // SHARED COMPONENTS
    // ============================================================
    function ArticleCard({ article }) {
      return (
        <div className="bg-white rounded-xl shadow-sm p-6 card-hover transition">
          <div className="flex justify-between items-start">
            <div className="flex-1">
              <a
                href={article.url}
                target="_blank"
                rel="noopener noreferrer"
                className="text-lg font-semibold text-gray-800 hover:text-purple-600 transition"
              >
                {article.title}
              </a>
              <div className="flex items-center space-x-3 mt-2 text-sm text-gray-500">
                {article.source_name && <span>{article.source_name}</span>}
                {article.published_date && (
                  <span>{new Date(article.published_date).toLocaleDateString()}</span>
                )}
              </div>
            </div>
            {article.relevance_score && (
              <div className={`px-3 py-1 rounded-full text-sm font-medium ${
                article.relevance_score >= 8 ? 'bg-green-100 text-green-800' :
                article.relevance_score >= 5 ? 'bg-yellow-100 text-yellow-800' :
                'bg-gray-100 text-gray-800'
              }`}>
                {article.relevance_score}/10
              </div>
            )}
          </div>

          {article.topic_tags && article.topic_tags.length > 0 && (
            <div className="flex flex-wrap gap-2 mt-3">
              {article.topic_tags.map(tag => (
                <span key={tag} className="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs">
                  {tag}
                </span>
              ))}
            </div>
          )}

          {article.short_summary && (
            <p className="text-gray-600 text-sm mt-3">{article.short_summary}</p>
          )}
        </div>
      );
    }

    function LoadingSpinner() {
      return (
        <div className="flex flex-col items-center justify-center py-16">
          <div className="w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin mb-4"></div>
          <p className="text-gray-500 text-sm">Loading...</p>
        </div>
      );
    }

    function EmptyState({ message }) {
      return (
        <div className="text-center py-12 text-gray-400">
          <p className="text-lg mb-1">No data yet</p>
          <p className="text-sm">{message}</p>
        </div>
      );
    }

    // ============================================================
    // MOUNT
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
